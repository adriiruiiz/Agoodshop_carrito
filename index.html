<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgoodShop - Carrito</title>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
   <h2 class="mb-4">AgoodShop</h2>
    <hr>
    
    <div class="row mt-4"> 

    <div class="col-md-8">
            <div class="row fw-bold border-bottom pb-2 mb-3">
                <div class="col-4">Producto</div>
                <div class="col-3">Cantidad</div>
                <div class="col-2">Precio Unidad</div>
                <div class="col-3">Total</div>
            </div>

        <div id="lista-productos"></div>
        </div>

        <div class="col-md-4">
            <div class="bg-light p-4 border rounded">
                <h4>Total</h4>
                <hr>

                <div id="resumen-lista" class="mb-3 text-muted small"></div>
                <hr>
                
                <div class="d-flex justify-content-between fw-bold fs-5">
                    <span>TOTAL</span>
                    <span><span id="precio-total">0.00</span>€</span>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
